name: zsh-debug
on:
  push:
    branches: [fix/shell-integration]
permissions:
  contents: read
jobs:
  zsh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: zsh shell integration (verbose)
        run: python3 src-tauri/src/modules/pty/scripts/zshrc.test.py
        env:
          TERAX_ZSH_TEST_DEBUG: "1"
          TERAX_ZSH_TEST_TIMEOUT: "3"
