<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Terax terminal visual harness: split panes</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #101214; color: #ccc; font: 12px system-ui; }
      #stage { position: absolute; left: 0; top: 0; width: var(--area-width, 1600px); height: var(--area-height, 1000px); overflow: hidden; }
      #grid { position: absolute; left: var(--grid-left, 0px); top: var(--grid-top, 0px); width: var(--grid-width, 960px); height: var(--grid-height, 560px); }
      .pane { position: absolute; }
      .divider { position: absolute; background: #5a6070; }
      .absolute { position: absolute; } .inset-0 { inset: 0; } .overflow-hidden { overflow: hidden; } .block { display: block; }
      #info { position: absolute; left: 8px; bottom: 6px; white-space: pre; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div id="stage" data-terminal-area><div id="grid"></div></div>
    <div id="info"></div>
    <script type="module" src="./grid.ts"></script>
  </body>
</html>
