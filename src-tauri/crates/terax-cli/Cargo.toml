[package]
name = "terax-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "terax-cli"
path = "src/main.rs"

[dependencies]
dirs = "6"
serde_json = "1"
terax-control-protocol = { path = "../terax-control-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
